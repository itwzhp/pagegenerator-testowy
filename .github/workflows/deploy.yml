# Plik szablonu (upstream). Nie edytuj w repo jednostki.
#
# main          → produkcja (wrangler deploy)
# każda inna    → podgląd    (wrangler versions upload --preview-alias <gałąź>)
#
# Nazwa Workera = nazwa repozytorium (np. pagegenerator-hufiec-x). Worker musi istnieć wcześniej:
# zakłada go Wydział IT przy tworzeniu repo jednostki (patrz README → „Zakładanie repo jednostki”).
#
# Uwierzytelnienie (zasada minimalnych uprawnień):
#   secrets.CLOUDFLARE_API_TOKEN – sekret REPOZYTORIUM: account-owned token ze scope
#                                  „Specified Workers” = tylko Worker tej jednostki, rola Editor
#                                  (może wdrażać, nie może tworzyć ani usuwać Workerów)
#   vars.CLOUDFLARE_ACCOUNT_ID   – zmienna (nie sekret), może być na poziomie organizacji
# Bez tokenu workflow tylko buduje i sprawdza stronę (np. w samym repo szablonu).
#
# Skille /zhp-generuj-podglad i /zhp-wgraj-zmiany szukają w logu linii "ZHP_URL=".
name: Build i deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # = bash -eo pipefail: błąd wranglera nie zginie w "| tee"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sprawdzenie (astro check + testy)
        run: npm run check && npm run test

      - run: npm run build

      - name: Nazwy Workera i aliasu podglądu
        id: names
        run: |
          slug() { echo "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g'; }
          worker="$(slug "${{ github.event.repository.name }}")"
          worker="${worker:0:54}"; worker="${worker%-}"
          # alias + "-" + worker musi zmieścić się w etykiecie DNS (63 znaki)
          max=$(( 63 - ${#worker} - 1 ))
          alias="$(slug "${GITHUB_REF_NAME}")"
          alias="${alias:0:$max}"; alias="${alias%-}"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Brak konfiguracji Cloudflare — pomijam deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Brak sekretu CLOUDFLARE_API_TOKEN lub zmiennej CLOUDFLARE_ACCOUNT_ID — strona zbudowana, ale nie wdrożona."

      - name: Deploy produkcyjny
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx wrangler deploy --name "${{ steps.names.outputs.worker }}" 2>&1 | tee wrangler.log
          url=$(grep -Eo 'https://[^ ]+\.workers\.dev' wrangler.log | head -1)
          echo "ZHP_URL=$url"
          echo "### 🚀 Produkcja: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy podglądu
        if: github.ref != 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx wrangler versions upload \
            --name "${{ steps.names.outputs.worker }}" \
            --preview-alias "${{ steps.names.outputs.alias }}" 2>&1 | tee wrangler.log
          url=$(grep -E 'Alias URL' wrangler.log | grep -Eo 'https://[^ ]+\.workers\.dev' | head -1)
          if [ -z "$url" ]; then url=$(grep -Eo 'https://[^ ]+\.workers\.dev' wrangler.log | head -1); fi
          echo "ZHP_URL=$url"
          echo "### 👀 Podgląd: $url" >> "$GITHUB_STEP_SUMMARY"
